name: PR title

# `pull_request_target` never starts for a pull request that GitHub Actions
# opens or updates, so the required check stayed unreported on every release
# pull request. `pull_request` starts for those events.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            revert
        env:
          GITHUB_TOKEN: ${{ github.token }}
