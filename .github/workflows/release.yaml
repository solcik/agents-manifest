name: Release binaries

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" == v* ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "agents-manifest") | .version')
          test "$TAG" = "v$version"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Check native binary
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          test "$target" = "${{ matrix.target }}"
          target/release/agent-skills --version
          target/release/agent-skills validate examples/skills.yaml --json
      - name: Package native binary
        run: |
          tar -czf "agent-skills-${{ matrix.target }}.tar.gz" \
            -C target/release agent-skills -C "$GITHUB_WORKSPACE" LICENSE
      - uses: actions/attest@v4
        with:
          subject-path: agent-skills-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: agent-skills-${{ matrix.target }}
          path: agent-skills-${{ matrix.target }}.tar.gz
          if-no-files-found: error
  compatibility:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: agent-skills-${{ matrix.target }}
      - name: Check older-Ubuntu binary on newer Ubuntu
        run: |
          tar -xzf "agent-skills-${{ matrix.target }}.tar.gz"
          ./agent-skills --version
          ./agent-skills validate examples/skills.yaml --json
  publish:
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-skills-*
          merge-multiple: true
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha256sum agent-skills-*.tar.gz > SHA256SUMS
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" agent-skills-*.tar.gz SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false
