name: Release automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-automation
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'solcik/agents-manifest' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: tag
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag=$(jq -er 'if length == 1 and .[0].package_name == "agents-manifest" then .[0].tag else error("Expected one CLI release") end' <<< "$RELEASES")
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
  binaries:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.release.outputs.tag }}
  release-pr:
    needs: release
    if: github.repository == 'solcik/agents-manifest' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # `github.token` opens the release pull request as GitHub Actions.
      # GitHub then holds every check on that pull request for approval.
      # `RELEASE_PLZ_TOKEN` opens it as a person, and the checks start.
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
