[workspace]
git_only = true
release_always = false
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
git_release_draft = true
git_release_body = "{{ changelog }}"
semver_check = false
dependencies_update = false
features_always_increment_minor = true
pr_name = "chore(release): prepare the next release"
release_commits = "(?m)^(feat|fix|perf|refactor)(\\([^\\r\\n]+\\))?:|^[a-z]+(\\([^\\r\\n]+\\))?!:|^BREAKING CHANGE:"

[[package]]
name = "agents-manifest"
changelog_path = "CHANGELOG.md"

[changelog]
header = "# Changelog\n\nThis file records changes for each release.\n"
body = """
## {% if release_link %}[{{ version }}]({{ release_link }}){% else %}{{ version }}{% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, changes in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in changes %}
- {% if commit.breaking %}**BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}{% for link in commit.links %} ([{{ link.text }}]({{ link.href }})){% endfor %}
{% endfor %}
{% endfor %}
{% set contributors = commits | filter(attribute="remote.username") | map(attribute="remote.username") | unique | sort %}
{% if contributors %}
### Contributors
{% for username in contributors %}
- @{{ username }}
{% endfor %}
{% endif %}
"""
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\):", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^(test|ci|build|chore)", group = "Maintenance" },
  { message = ".*", group = "Other changes" },
]
